# Render Blueprint: a managed PostgreSQL database plus the MouldCare web service built from the Dockerfile, with a small
# persistent disk for uploaded files (photos, manuals, vision evidence); and MouldCare Monitor (monitor/), a separate
# web service with its own SQLite database on its own disk.
# Render generates the secrets; you enter the first admin's email and password when creating the Blueprint.
# Region is fixed at creation; singapore is closest to India (alternatives: frankfurt, oregon, ohio, virginia).
services:
  - type: web
    name: plastics-maintenance-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: platform-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: platform-db
          property: connectionString
      - key: MOULDCARE_SECRET
        generateValue: true
      - key: MOULDCARE_INTEGRATION_KEY
        generateValue: true
      - key: MOULDCARE_ADMIN_EMAIL
        sync: false
      - key: MOULDCARE_ADMIN_PASSWORD
        sync: false
      - key: MOULDCARE_SEED_DEMO
        value: "false"
      - key: IOT_SYNC_ADAPTER
        value: mock
      - key: IOT_SYNC_INTERVAL_SECONDS
        value: "0"
      # Simulated machine data is for demos only; keep it off where real customer data lives.
      - key: FACTORY_SIMULATOR
        value: "false"
      # Breakdown assistant (AI): an Anthropic API key from console.anthropic.com. Leave empty to keep it off.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # WhatsApp alerts and ticket updates (Meta WhatsApp Business Cloud API); see README → WhatsApp notifications.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE
        sync: false
      - key: WHATSAPP_TEMPLATE_LANG
        sync: false
      - key: WHATSAPP_API_VERSION
        sync: false

  # MouldCare Monitor: machine and condition monitoring with ML and AI (monitor/README.md). Its database is SQLite on
  # its own disk. It shows the six demo machines with simulated readings and no demo accounts (their password is
  # published); you sign in with the admin email and password you enter when the Blueprint asks. When real gateways
  # send data, set MONITOR_SEED_DEMO and MONITOR_SIMULATOR to false on a fresh disk.
  - type: web
    name: mouldcare-monitor
    runtime: docker
    dockerfilePath: ./monitor/Dockerfile
    dockerContext: ./monitor
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - monitor/**
    disk:
      name: monitor-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: MONITOR_SECRET
        generateValue: true
      - key: MONITOR_INGEST_KEY
        generateValue: true
      - key: MONITOR_ADMIN_EMAIL
        sync: false
      - key: MONITOR_ADMIN_PASSWORD
        sync: false
      - key: MONITOR_SEED_DEMO
        value: "true"
      - key: MONITOR_DEMO_ACCOUNTS
        value: "false"
      - key: MONITOR_SIMULATOR
        value: "true"
      # AI explanations, ticket drafts, reports and chat. Leave empty to use the built-in explanations only.
      - key: ANTHROPIC_API_KEY
        sync: false
      # MQTT intake. Leave MONITOR_MQTT_URL empty to keep it off. The topic defaults to mouldcare/#.
      - key: MONITOR_MQTT_URL
        sync: false
      - key: MONITOR_MQTT_USERNAME
        sync: false
      - key: MONITOR_MQTT_PASSWORD
        sync: false
      - key: MONITOR_MQTT_TOPIC
        sync: false
      - key: MONITOR_MQTT_CLIENT_ID
        sync: false

databases:
  - name: platform-db
    databaseName: mouldcare
    user: mouldcare
    plan: basic-256mb   # smallest paid plan; check render.com/pricing. Keep it in the same region as the web service.
    region: singapore
