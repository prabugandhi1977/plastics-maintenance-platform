# Local or single-server deployment: the platform plus PostgreSQL. Settings come from a .env file next to this one
# (copy .env.example). Data: PostgreSQL in the "db-data" volume, uploaded files in "platform-data".
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mouldcare
      POSTGRES_USER: mouldcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mouldcare -d mouldcare"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  platform:
    build: .
    image: plastics-maintenance-platform
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-3100}:3100"
    environment:
      DATABASE_URL: postgres://mouldcare:${POSTGRES_PASSWORD}@db:5432/mouldcare
      MOULDCARE_SECRET: ${MOULDCARE_SECRET:?Set MOULDCARE_SECRET (32+ random characters) in .env}
      MOULDCARE_INTEGRATION_KEY: ${MOULDCARE_INTEGRATION_KEY:-}
      MOULDCARE_SEED_DEMO: ${MOULDCARE_SEED_DEMO:-false}
      MOULDCARE_ADMIN_EMAIL: ${MOULDCARE_ADMIN_EMAIL:-}
      MOULDCARE_ADMIN_PASSWORD: ${MOULDCARE_ADMIN_PASSWORD:-}
      IOT_SYNC_ADAPTER: ${IOT_SYNC_ADAPTER:-mock}
      IOT_SYNC_INTERVAL_SECONDS: ${IOT_SYNC_INTERVAL_SECONDS:-0}
      FACTORY_SIMULATOR: ${FACTORY_SIMULATOR:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # MouldCare Monitor inside the same container, served at /monitor (see monitor/README.md). Off by default.
      MONITOR_EMBED: ${MONITOR_EMBED:-false}
      MONITOR_SECRET: ${MONITOR_SECRET:-}
      MONITOR_INGEST_KEY: ${MONITOR_INGEST_KEY:-}
      MONITOR_ADMIN_EMAIL: ${MONITOR_ADMIN_EMAIL:-}
      MONITOR_ADMIN_PASSWORD: ${MONITOR_ADMIN_PASSWORD:-}
      MONITOR_MOULDCARE_KEY: ${MONITOR_MOULDCARE_KEY:-}
      MONITOR_SEED_DEMO: ${MONITOR_SEED_DEMO:-false}
      MONITOR_DEMO_ACCOUNTS: ${MONITOR_DEMO_ACCOUNTS:-false}
      MONITOR_SIMULATOR: ${MONITOR_SIMULATOR:-false}
    volumes:
      - platform-data:/data
    restart: unless-stopped

  # Virtual plant for testing the platform end to end:  docker compose --profile sim up -d --build
  # First create its machines and devices once:  cd simulator && npm run provision -- --password <admin password>
  vplant:
    profiles: ["sim"]
    build: ./simulator
    image: mouldcare-virtual-plant
    depends_on:
      platform:
        condition: service_started
    environment:
      PLATFORM_URL: http://platform:3100
      MOULDCARE_INTEGRATION_KEY: ${MOULDCARE_INTEGRATION_KEY:?Set MOULDCARE_INTEGRATION_KEY in .env}
      VPLANT_MACHINES: ${VPLANT_MACHINES:-6}
      VPLANT_SPEED: ${VPLANT_SPEED:-1}
    command: ["run", "--gateway", "--spool", "/data/spool.json", "--scenario", "${VPLANT_SCENARIO:-normal-day}"]
    ports:
      - "4850:4850"
      - "4840:4840"
      - "1883:1883"
    volumes:
      - vplant-data:/data
    restart: unless-stopped

volumes:
  vplant-data:
  db-data:
  platform-data:
