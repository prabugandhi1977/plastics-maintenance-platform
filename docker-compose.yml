# Local or single-server deployment: the platform plus PostgreSQL. Settings come from a .env file next to this one
# (copy .env.example). Data: PostgreSQL in the "db-data" volume, uploaded files in "platform-data".
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mouldcare
      POSTGRES_USER: mouldcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mouldcare -d mouldcare"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  platform:
    build: .
    image: plastics-maintenance-platform
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-3100}:3100"
    environment:
      DATABASE_URL: postgres://mouldcare:${POSTGRES_PASSWORD}@db:5432/mouldcare
      MOULDCARE_SECRET: ${MOULDCARE_SECRET:?Set MOULDCARE_SECRET (32+ random characters) in .env}
      MOULDCARE_INTEGRATION_KEY: ${MOULDCARE_INTEGRATION_KEY:-}
      MOULDCARE_SEED_DEMO: ${MOULDCARE_SEED_DEMO:-false}
      MOULDCARE_ADMIN_EMAIL: ${MOULDCARE_ADMIN_EMAIL:-}
      MOULDCARE_ADMIN_PASSWORD: ${MOULDCARE_ADMIN_PASSWORD:-}
      IOT_SYNC_ADAPTER: ${IOT_SYNC_ADAPTER:-mock}
      IOT_SYNC_INTERVAL_SECONDS: ${IOT_SYNC_INTERVAL_SECONDS:-0}
      FACTORY_SIMULATOR: ${FACTORY_SIMULATOR:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - platform-data:/data
    restart: unless-stopped
volumes:
  db-data:
  platform-data:
